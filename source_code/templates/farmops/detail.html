{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">{{ object }}</h1>
  <div><a class="btn btn-outline-primary" href="edit/">Edit</a> <a class="btn btn-outline-danger" href="delete/">Delete</a></div>
</div>
<dl class="row detail-list">
  <dt class="col-sm-3">Record Type</dt>
  <dd class="col-sm-9">{{ object._meta.verbose_name|title }}</dd>
  <dt class="col-sm-3">Summary</dt>
  <dd class="col-sm-9">{{ object }}</dd>
  <dt class="col-sm-3">Created</dt>
  <dd class="col-sm-9">{{ object.created_at|date:"d M Y H:i" }}</dd>
  <dt class="col-sm-3">Updated</dt>
  <dd class="col-sm-9">{{ object.updated_at|date:"d M Y H:i" }}</dd>
</dl>
{% endblock %}
