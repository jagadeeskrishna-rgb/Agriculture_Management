{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">{{ view.model._meta.verbose_name|title }} Form</h1>
<form method="post" novalidate>
  {% csrf_token %}
  <div class="form-grid">{{ form.as_p }}</div>
  <button class="btn btn-success">Save</button>
  <a class="btn btn-outline-secondary" href="javascript:history.back()">Cancel</a>
</form>
{% endblock %}
